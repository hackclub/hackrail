services:
  app:
    build: .
    container_name: compass
    ports:
      - "4321:4321"
    volumes:
      - compass-data:/app/data
    environment:
      - CLIENT_SECRET=${CLIENT_SECRET}
      - PUBLIC_CLIENT_ID=${PUBLIC_CLIENT_ID}
      - PUBLIC_REDIRECT_URI=${PUBLIC_REDIRECT_URI}
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 256m
    restart: unless-stopped

volumes:
  compass-data:
