<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">IRCTC Train Grant artwork</title>
  <desc id="desc">Illustrated train on a deep blue background, with IRCTC Train Grant text and a subtle Indian tricolor accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d71"/>
      <stop offset="1" stop-color="#0d2345"/>
    </linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#dce8f8"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="760" fill="url(#bg)"/>
  <circle cx="870" cy="132" r="178" fill="#ffffff" opacity=".035"/>
  <circle cx="172" cy="588" r="204" fill="#ffffff" opacity=".03"/>
  <g transform="translate(330 94)">
